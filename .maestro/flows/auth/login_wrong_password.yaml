appId: uz.merge4.nonstop
name: "Login - Wrong Password"
tags:
  - auth
  - negative
---
# Test: wrong password should stay on login screen
- launchApp:
    clearState: true
- assertVisible:
    id: "login_email_field"
- tapOn:
    id: "login_email_field"
- inputText: "hongdroid94@naver.com"
- tapOn:
    id: "login_password_field"
- inputText: "wrongpassword123"
- tapOn:
    id: "login_submit_button"

# Wait a moment then verify still on login screen
- extendedWaitUntil:
    visible:
      id: "login_email_field"
    timeout: 8000
- assertVisible:
    id: "login_submit_button"
