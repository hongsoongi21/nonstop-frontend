name: nonstop
description: "Nonstop - University community app for timetable, chat, boards, and friends."
publish_to: "none"

version: 1.0.7+40

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  logging: ^1.2.0
  intl: ^0.20.2
  flutter_riverpod: ^2.5.1
  flutter_secure_storage: ^10.0.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  go_router: ^17.0.1
  cached_network_image: ^3.3.1
  fpdart: ^1.1.0
  device_info_plus: ^12.3.0
  flutter_screenutil: ^5.9.0
  firebase_core: ^4.4.0
  firebase_crashlytics: ^5.0.7
  firebase_analytics: ^12.1.1
  firebase_messaging: ^16.0.4
  flutter_local_notifications: ^19.0.3
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^6.1.4
  crypto: ^3.0.6
  firebase_auth: ^6.1.4
  url_launcher: ^6.3.2
  image_picker: ^1.1.2
  path: ^1.9.0
  shared_preferences: ^2.5.4
  dice_bear: ^0.1.7
  supabase_flutter: ^2.8.0
  package_info_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  freezed: ^2.5.8
  json_serializable: ^6.7.1
  build_runner: ^2.4.8
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  remove_alpha_ios: true

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Thin.ttf
          weight: 100
        - asset: assets/fonts/Pretendard-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Pretendard-Light.ttf
          weight: 300
        - asset: assets/fonts/Pretendard-Regular.ttf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.ttf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.ttf
          weight: 700
        - asset: assets/fonts/Pretendard-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Pretendard-Black.ttf
          weight: 900
