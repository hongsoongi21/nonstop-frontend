# Android Deployment Workflow
name: Android Deploy

on:
  push:
    branches:
      - main
      - release/*
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      track:
        description: 'Deployment track'
        required: true
        default: 'internal'
        type: choice
        options:
          - firebase
          - internal
          - alpha
          - beta
          - production

env:
  FLUTTER_VERSION: '3.24.0'
  JAVA_VERSION: '17'

jobs:
  build-and-deploy:
    name: Build and Deploy Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Setup Ruby (for Fastlane)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: android

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Decode Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

      - name: Create key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > android/key.properties << EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Decode Google Play Service Account
        env:
          GOOGLE_PLAY_JSON_KEY_BASE64: ${{ secrets.GOOGLE_PLAY_JSON_KEY_BASE64 }}
        run: |
          echo "$GOOGLE_PLAY_JSON_KEY_BASE64" | base64 --decode > android/fastlane/google-play-key.json

      - name: Deploy to Firebase App Distribution
        if: github.event.inputs.track == 'firebase' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          FIREBASE_CLI_TOKEN: ${{ secrets.FIREBASE_CLI_TOKEN }}
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
        working-directory: android
        run: |
          bundle install
          bundle exec fastlane firebase_internal build_number:${{ github.run_number }} notes:"Build from commit ${{ github.sha }}"

      - name: Deploy to Play Store (Internal)
        if: github.event.inputs.track == 'internal'
        working-directory: android
        run: |
          bundle install
          bundle exec fastlane internal build_number:${{ github.run_number }}

      - name: Deploy to Play Store (Alpha)
        if: github.event.inputs.track == 'alpha'
        working-directory: android
        run: |
          bundle install
          bundle exec fastlane alpha build_number:${{ github.run_number }}

      - name: Deploy to Play Store (Beta)
        if: github.event.inputs.track == 'beta'
        working-directory: android
        run: |
          bundle install
          bundle exec fastlane beta build_number:${{ github.run_number }}

      - name: Deploy to Play Store (Production)
        if: github.event.inputs.track == 'production' || startsWith(github.ref, 'refs/tags/v')
        working-directory: android
        run: |
          bundle install
          bundle exec fastlane production build_number:${{ github.run_number }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          retention-days: 14
