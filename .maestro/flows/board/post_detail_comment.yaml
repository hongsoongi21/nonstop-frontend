appId: uz.merge4.nonstop
name: "Board - View Post and Comment"
tags:
  - board
  - crud
---
# Prerequisite: user is logged in
- launchApp
- extendedWaitUntil:
    visible:
      id: "nav_board"
    timeout: 10000

# Make sure we're on the board tab
- tapOn:
    id: "nav_board"
- extendedWaitUntil:
    visible: "Latest"
    timeout: 5000

# Tap on the first post card
- tapOn:
    id: "board_post_0"

# Wait for post detail screen
- extendedWaitUntil:
    visible:
      id: "board_detail_comment_input"
    timeout: 8000

# Verify like button
- assertVisible:
    id: "board_detail_like_btn"

# Tap like
- tapOn:
    id: "board_detail_like_btn"

# Write a comment
- tapOn:
    id: "board_detail_comment_input"
- inputText: "Auto test comment"

# Send comment
- tapOn:
    id: "board_detail_comment_send"

# Verify comment appears
- extendedWaitUntil:
    visible: "Auto test comment"
    timeout: 5000

# Go back
- back
